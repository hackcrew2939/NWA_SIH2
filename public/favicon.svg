<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Cloud glow filter -->
    <filter id="cloudGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Lightning glow filter -->
    <filter id="boltGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Cloud gradient: white/light-blue -->
    <radialGradient id="cloudGrad" cx="50%" cy="35%" r="60%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="60%"  stop-color="#cce4ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#90c4f9" stop-opacity="0.85"/>
    </radialGradient>
    <!-- Lightning gradient: cyan to blue -->
    <linearGradient id="boltGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%"   stop-color="#00e5ff"/>
      <stop offset="50%"  stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d6fe8"/>
    </linearGradient>
    <!-- Outer bolt stroke glow -->
    <linearGradient id="boltStroke" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%"   stop-color="#b3f0ff"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Cloud shape -->
  <g filter="url(#cloudGlow)">
    <!-- Main large cloud body -->
    <ellipse cx="52" cy="44" rx="28" ry="18" fill="url(#cloudGrad)"/>
    <!-- Top-left bump -->
    <circle cx="36" cy="38" r="14" fill="url(#cloudGrad)"/>
    <!-- Top-center bump (tallest) -->
    <circle cx="52" cy="32" r="16" fill="url(#cloudGrad)"/>
    <!-- Top-right bump -->
    <circle cx="66" cy="38" r="12" fill="url(#cloudGrad)"/>
    <!-- Bottom fill to smooth the cloud base -->
    <rect x="24" y="44" width="56" height="14" rx="7" fill="url(#cloudGrad)"/>
  </g>

  <!-- Lightning bolt — outer glow stroke -->
  <g filter="url(#boltGlow)">
    <polygon
      points="53,38 44,57 50,57 44,75 60,52 54,52 62,38"
      fill="none"
      stroke="url(#boltStroke)"
      stroke-width="4"
      stroke-linejoin="round"
      opacity="0.6"
    />
  </g>

  <!-- Lightning bolt — filled shape -->
  <polygon
    points="53,38 44,57 50,57 44,75 60,52 54,52 62,38"
    fill="url(#boltGrad)"
    stroke="#0ea5e9"
    stroke-width="1.2"
    stroke-linejoin="round"
    filter="url(#boltGlow)"
  />
</svg>
