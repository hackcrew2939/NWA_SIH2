version: '3.8'

# ==============================================================================
# NWA National Scalability Microservices & Horizontal Cluster Orchestration
# ==============================================================================

networks:
  nwa-mesh:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  sqlite_data:
  redis_data:
  kafka_data:
  zookeeper_data:
  clickhouse_data:
  prometheus_data:

services:
  # ----------------------------------------------------------------------------
  # Layer-7 Reverse Proxy & Load Balancer (NGINX)
  # ----------------------------------------------------------------------------
  load-balancer:
    image: nginx:alpine
    container_name: nwa-load-balancer
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app_node_1
      - app_node_2
      - app_node_3
    networks:
      - nwa-mesh
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ----------------------------------------------------------------------------
  # Horizontally Scaled Application Nodes (Microservice Replicas)
  # ----------------------------------------------------------------------------
  app_node_1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nwa-app-node-1
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NODE_ID=node-worker-01
      - CLUSTER_WORKERS=2
      - REDIS_URL=redis://redis-cache:6379
      - KAFKA_BROKERS=kafka:9092
    volumes:
      - sqlite_data:/usr/src/app/data
    networks:
      - nwa-mesh
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M

  app_node_2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nwa-app-node-2
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NODE_ID=node-worker-02
      - CLUSTER_WORKERS=2
      - REDIS_URL=redis://redis-cache:6379
      - KAFKA_BROKERS=kafka:9092
    volumes:
      - sqlite_data:/usr/src/app/data
    networks:
      - nwa-mesh
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M

  app_node_3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nwa-app-node-3
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NODE_ID=node-worker-03
      - CLUSTER_WORKERS=2
      - REDIS_URL=redis://redis-cache:6379
      - KAFKA_BROKERS=kafka:9092
    volumes:
      - sqlite_data:/usr/src/app/data
    networks:
      - nwa-mesh
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M

  # ----------------------------------------------------------------------------
  # Distributed Cache & State Management (Redis Cluster)
  # ----------------------------------------------------------------------------
  redis-cache:
    image: redis:7-alpine
    container_name: nwa-redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nwa-mesh
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ----------------------------------------------------------------------------
  # Event Streaming & Ingestion Pipeline (Apache Kafka + Zookeeper)
  # ----------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: nwa-zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - nwa-mesh

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: nwa-kafka
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - nwa-mesh

  # ----------------------------------------------------------------------------
  # Analytical Big Data Warehouse (ClickHouse OLAP)
  # ----------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:23.8-alpine
    container_name: nwa-clickhouse
    restart: always
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - nwa-mesh
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
