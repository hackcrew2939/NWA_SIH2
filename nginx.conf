# ==============================================================================
# NGINX High-Performance Layer-7 Load Balancer & Reverse Proxy Configuration
# National Weather Analytics (NWA) Scalability Architecture
# ==============================================================================

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance & Network Tweaks
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression for Fast Transmission
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;

    # Rate Limiting Zones (DDoS Mitigation)
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:20m;

    # Upstream Node.js Cluster with Least Connections Algorithm
    upstream nwa_cluster {
        least_conn;
        server app_node_1:3000 max_fails=3 fail_timeout=10s;
        server app_node_2:3000 max_fails=3 fail_timeout=10s;
        server app_node_3:3000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name localhost _;

        # Maximum payload size for file uploads & radar imagery
        client_max_body_size 50M;

        # Rate and Connection Limits
        limit_conn conn_limit 50;

        # Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Cluster-Nodes "3-Node-Active" always;

        # Healthcheck endpoint for Ingress / LB monitors
        location /healthz {
            access_log off;
            return 200 '{"status":"UP","gateway":"nginx-lb","cluster_status":"healthy"}\n';
            add_header Content-Type application/json;
        }

        # Authentication Routes with Strict Rate Limiting
        location /api/v1/auth/login {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://nwa_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Real-Time SSE Streams (Kafka / Alerts Live Stream)
        location /api/v1/stream/ {
            proxy_pass http://nwa_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # SSE specific buffering disables
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 86400s;
        }

        # General API Traffic
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://nwa_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # Static Assets & Web Application Frontend
        location / {
            proxy_pass http://nwa_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
