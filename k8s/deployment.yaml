apiVersion: apps/v1
kind: Deployment
metadata:
  name: nwa-api-deployment
  namespace: nwa-production
  labels:
    app.kubernetes.io/name: nwa-api
    app.kubernetes.io/part-of: nwa-platform
    app.kubernetes.io/version: "2.4.0"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: nwa-api
  template:
    metadata:
      labels:
        app: nwa-api
        tier: backend
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - nwa-api
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: nwa-worker
          image: nwa-platform:2.4.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http-api
          envFrom:
            - configMapRef:
                name: nwa-cluster-config
            - secretRef:
                name: nwa-platform-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2048Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
